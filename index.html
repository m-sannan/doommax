<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoomMax — All your feeds. One scroll. No mercy.</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="hero">
    <h1>DoomMax</h1>
    <p class="tagline">All your feeds. One scroll. No mercy.</p>
    <a href="#feed" class="cta">Start the descent ↓</a>
  </header>

  <main id="feed" class="feed"></main>

  <footer class="capture">
    <form id="email-form">
      <input type="email" id="email" placeholder="email@doommax.app" required />
      <button type="submit">Get the real thing</button>
    </form>
    <p class="note">Satirical demo. No real feeds. No mercy either.</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
